
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEXORA | Connexion</title>
  <style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 75% 5%,#30235d,transparent 45%),#090d19;color:#f7f9ff;font-family:Inter,system-ui,Arial;display:grid;place-items:center;padding:22px}.card{width:100%;max-width:450px;padding:35px;background:linear-gradient(150deg,#1a2138,#11172a);border:1px solid #36405d;border-radius:23px;box-shadow:0 30px 80px #0005}h1{font-size:34px;letter-spacing:-1px;margin:0;color:#fff}h1 span{color:#71e9d4}p{color:#aebad3;line-height:1.65}input,button{width:100%;padding:14px 15px;margin-top:13px;border-radius:12px;font-size:15px}input{background:#0d1425;color:#fff;border:1px solid #3c4762;outline:none}input:focus{border-color:#a78bfa;box-shadow:0 0 0 3px #a78bfa22}button{background:linear-gradient(110deg,#9062f5,#5a6af5);color:#fff;border:0;cursor:pointer;font-weight:800}button:disabled{opacity:.5}.secondary{background:#28314b;border:1px solid #45516d}#message{min-height:24px;color:#8ff4df;font-size:14px;overflow-wrap:anywhere}a{color:#a996ff;text-decoration:none}.back{display:inline-block;margin-top:22px;font-size:14px}[hidden]{display:none!important}/* NEXORA editorial identity */
:root{color-scheme:light}body{background:#f6f7f3;color:#1a2c25;font-family:Inter,ui-sans-serif,system-ui,Arial}.card{background:#fff;border:1px solid #dfe6de;border-radius:16px;box-shadow:0 20px 60px #1b302912}.card h1,.card h1 span{color:#1b3029}.card h1 span{color:#2c695c}.card p{color:#6b7b72}input{background:#f9faf7;border:1px solid #d3ddd4;color:#1a2c25}input:focus{border-color:#2c695c;box-shadow:0 0 0 3px #2c695c15}button{background:#204d43;border-radius:9px;font-weight:650}button:hover{background:#15392f}.secondary{background:#eff3ed;color:#204d43;border:1px solid #d6e0d6}.secondary:hover{background:#e5eee4}a{color:#286454}#message{color:#2c695c}</style>
</head>
<body>
  <main class="card">
    <h1>NEXORA<span>.</span></h1>
    <p>AvisBoost · Espace client</p>

    <section id="auth">
      <form id="authForm">
        <input id="email" type="email"
          placeholder="Adresse e-mail"
          autocomplete="email" required>
        <input id="password" type="password"
          placeholder="Mot de passe"
          autocomplete="current-password"
          minlength="8" required>
        <button id="login" type="submit">
          Se connecter
        </button>
        <button id="signup" type="button"
          class="secondary">
          Créer mon compte
        </button>
        <button id="forgot" type="button" class="secondary">Mot de passe oublié ?</button>
      </form>
    </section>

    <section id="resetPanel" hidden><h2>Nouveau mot de passe</h2><form id="resetForm"><input id="newPassword" type="password" minlength="10" autocomplete="new-password" placeholder="10 caractères minimum" required><button type="submit">Modifier mon mot de passe</button></form></section><section id="account" hidden>
      <h2>Bienvenue !</h2>
      <p id="userEmail"></p>
      <p>Ton compte est connecté.</p><a href="espace-client.html">Ouvrir mon tableau de bord →</a>
      <button id="logout">Se déconnecter</button>
    </section>

    <p id="message" role="status"></p>
    <a href="index.html">Retour à l'accueil</a>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    // Remplace uniquement ces deux valeurs.
    const PROJECT_URL = "https://oywvbrwbuqzdjrmxukho.supabase.co";
    const PUBLISHABLE_KEY = "sb_publishable_ktzBeglUCAKdZhb-xX2reg_iDKhmFTn";

    const message = document.querySelector("#message");
    const auth = document.querySelector("#auth");
    const account = document.querySelector("#account");
    const userEmail = document.querySelector("#userEmail");
    const email = document.querySelector("#email");
    const password = document.querySelector("#password");
    const login = document.querySelector("#login");
    const signup = document.querySelector("#signup");
    let recoveryMode=false;

    if (PROJECT_URL === "TON_PROJECT_URL" ||
        PUBLISHABLE_KEY === "TA_PUBLISHABLE_KEY") {
      message.textContent =
        "Configure d'abord Supabase dans le code.";
      throw new Error("Configuration Supabase manquante");
    }

    const supabase = createClient(
      PROJECT_URL,
      PUBLISHABLE_KEY
    );

    function showUser(user) {
      auth.hidden = recoveryMode || Boolean(user);
      account.hidden = recoveryMode || !user;
      document.querySelector("#resetPanel").hidden=!recoveryMode;
      userEmail.textContent = user?.email || "";
    }

    function setBusy(busy) {
      login.disabled = busy;
      signup.disabled = busy;
    }

    async function signIn(event) {
      event.preventDefault();
      setBusy(true);
      message.textContent = "Connexion en cours...";

      const { error } =
        await supabase.auth.signInWithPassword({
          email: email.value.trim(),
          password: password.value
        });

      message.textContent = error
        ? error.message
        : "Connexion réussie !";
      setBusy(false);
      if (!error) window.location.href = "espace-client.html";
    }

    async function signUp() {
      if (!document.querySelector("#authForm")
        .reportValidity()) return;

      setBusy(true);
      message.textContent = "Création du compte...";

      const { error } = await supabase.auth.signUp({
        email: email.value.trim(),
        password: password.value,
        options: {
          emailRedirectTo:
            window.location.origin +
            window.location.pathname
        }
      });

      message.textContent = error
        ? error.message
        : "Vérifie tes e-mails pour confirmer ton compte.";
      setBusy(false);
    }

    async function signOut() {
      const { error } = await supabase.auth.signOut();
      message.textContent = error
        ? error.message
        : "Déconnexion réussie.";
    }


    document.querySelector("#forgot").addEventListener("click",async()=>{
      if(!email.value.trim()||!email.checkValidity()){message.textContent="Saisis ton e-mail valide.";return;}
      const button=document.querySelector("#forgot");button.disabled=true;
      const {error}=await supabase.auth.resetPasswordForEmail(email.value.trim(),{redirectTo:window.location.origin+window.location.pathname});
      message.textContent=error?error.message:"Si ce compte existe, un lien a été envoyé par e-mail.";
      button.disabled=false;
    });
    document.querySelector("#resetForm").addEventListener("submit",async event=>{
      event.preventDefault();
      const {error}=await supabase.auth.updateUser({password:document.querySelector("#newPassword").value});
      message.textContent=error?error.message:"Mot de passe mis à jour.";
      if(!error){recoveryMode=false;const {data}=await supabase.auth.getUser();showUser(data?.user||null);}
    });
    document.querySelector("#authForm")
      .addEventListener("submit", signIn);
    signup.addEventListener("click", signUp);
    document.querySelector("#logout")
      .addEventListener("click", signOut);

    supabase.auth.onAuthStateChange((event, session) => {
      if(event==="PASSWORD_RECOVERY") recoveryMode=true;
      showUser(session?.user || null);
    });

    const { data, error } =
      await supabase.auth.getUser();

    if (error && error.name !== "AuthSessionMissingError") {
      message.textContent = error.message;
    }
    if(window.location.hash.includes("type=recovery"))recoveryMode=true;
    showUser(data?.user || null);
  </script>
</body>
</html>

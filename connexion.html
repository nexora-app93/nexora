
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEXORA | Connexion</title>
  <style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 75% 5%,#30235d,transparent 45%),#090d19;color:#f7f9ff;font-family:Inter,system-ui,Arial;display:grid;place-items:center;padding:22px}.card{width:100%;max-width:450px;padding:35px;background:linear-gradient(150deg,#1a2138,#11172a);border:1px solid #36405d;border-radius:23px;box-shadow:0 30px 80px #0005}h1{font-size:34px;letter-spacing:-1px;margin:0;color:#fff}h1 span{color:#71e9d4}p{color:#aebad3;line-height:1.65}input,button{width:100%;padding:14px 15px;margin-top:13px;border-radius:12px;font-size:15px}input{background:#0d1425;color:#fff;border:1px solid #3c4762;outline:none}input:focus{border-color:#a78bfa;box-shadow:0 0 0 3px #a78bfa22}button{background:linear-gradient(110deg,#9062f5,#5a6af5);color:#fff;border:0;cursor:pointer;font-weight:800}button:disabled{opacity:.5}.secondary{background:#28314b;border:1px solid #45516d}#message{min-height:24px;color:#8ff4df;font-size:14px;overflow-wrap:anywhere}a{color:#a996ff;text-decoration:none}.back{display:inline-block;margin-top:22px;font-size:14px}[hidden]{display:none!important}</style>
</head>
<body>
  <main class="card">
    <h1>NEXORA<span>✦</span></h1>
    <p>AvisBoost · Espace client</p>

    <section id="auth">
      <form id="authForm">
        <input id="email" type="email"
          placeholder="Adresse e-mail"
          autocomplete="email" required>
        <input id="password" type="password"
          placeholder="Mot de passe"
          autocomplete="current-password"
          minlength="8" required>
        <button id="login" type="submit">
          Se connecter
        </button>
        <button id="signup" type="button"
          class="secondary">
          Créer mon compte
        </button>
      </form>
    </section>

    <section id="account" hidden>
      <h2>Bienvenue !</h2>
      <p id="userEmail"></p>
      <p>Ton compte est connecté.</p><a href="espace-client.html">Ouvrir mon tableau de bord →</a>
      <button id="logout">Se déconnecter</button>
    </section>

    <p id="message" role="status"></p>
    <a href="index.html">Retour à l'accueil</a>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    // Remplace uniquement ces deux valeurs.
    const PROJECT_URL = "https://oywvbrwbuqzdjrmxukho.supabase.co";
    const PUBLISHABLE_KEY = "sb_publishable_ktzBeglUCAKdZhb-xX2reg_iDKhmFTn";

    const message = document.querySelector("#message");
    const auth = document.querySelector("#auth");
    const account = document.querySelector("#account");
    const userEmail = document.querySelector("#userEmail");
    const email = document.querySelector("#email");
    const password = document.querySelector("#password");
    const login = document.querySelector("#login");
    const signup = document.querySelector("#signup");

    if (PROJECT_URL === "TON_PROJECT_URL" ||
        PUBLISHABLE_KEY === "TA_PUBLISHABLE_KEY") {
      message.textContent =
        "Configure d'abord Supabase dans le code.";
      throw new Error("Configuration Supabase manquante");
    }

    const supabase = createClient(
      PROJECT_URL,
      PUBLISHABLE_KEY
    );

    function showUser(user) {
      auth.hidden = Boolean(user);
      account.hidden = !user;
      userEmail.textContent = user?.email || "";
    }

    function setBusy(busy) {
      login.disabled = busy;
      signup.disabled = busy;
    }

    async function signIn(event) {
      event.preventDefault();
      setBusy(true);
      message.textContent = "Connexion en cours...";

      const { error } =
        await supabase.auth.signInWithPassword({
          email: email.value.trim(),
          password: password.value
        });

      message.textContent = error
        ? error.message
        : "Connexion réussie !";
      setBusy(false);
      if (!error) window.location.href = "espace-client.html";
    }

    async function signUp() {
      if (!document.querySelector("#authForm")
        .reportValidity()) return;

      setBusy(true);
      message.textContent = "Création du compte...";

      const { error } = await supabase.auth.signUp({
        email: email.value.trim(),
        password: password.value,
        options: {
          emailRedirectTo:
            window.location.origin +
            window.location.pathname
        }
      });

      message.textContent = error
        ? error.message
        : "Vérifie tes e-mails pour confirmer ton compte.";
      setBusy(false);
    }

    async function signOut() {
      const { error } = await supabase.auth.signOut();
      message.textContent = error
        ? error.message
        : "Déconnexion réussie.";
    }

    document.querySelector("#authForm")
      .addEventListener("submit", signIn);
    signup.addEventListener("click", signUp);
    document.querySelector("#logout")
      .addEventListener("click", signOut);

    supabase.auth.onAuthStateChange((_event, session) => {
      showUser(session?.user || null);
    });

    const { data, error } =
      await supabase.auth.getUser();

    if (error && error.name !== "AuthSessionMissingError") {
      message.textContent = error.message;
    }
    showUser(data?.user || null);
  </script>
</body>
</html>
